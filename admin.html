<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản Lý Menu KING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B2E26;
            --secondary: #D4AF37;
            --light: #FFF5F0;
            --dark: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light);
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            background: linear-gradient(135deg, var(--primary), #6B1F18);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .admin-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--secondary);
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-danger {
            background: #E74C3C;
            color: white;
        }

        .btn-danger:hover {
            background: #C0392B;
        }

        .btn-success {
            background: #27AE60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .menu-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, var(--primary), #6B1F18);
            color: white;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--secondary);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #EEE;
        }

        tr:hover {
            background: #F9F9F9;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            min-width: auto;
        }

        .btn-edit {
            background: #3498DB;
            color: white;
        }

        .btn-edit:hover {
            background: #2980B9;
        }

        .btn-delete {
            background: #E74C3C;
            color: white;
        }

        .btn-delete:hover {
            background: #C0392B;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--secondary);
        }

        .modal-header h2 {
            color: var(--primary);
            font-size: 1.5em;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #DDD;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #EEE;
        }

        .image-preview {
            width: 100%;
            height: 200px;
            background: #F5F5F5;
            border: 2px dashed #DDD;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            overflow: hidden;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-card h3 {
            color: #999;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--primary);
        }

        .export-import {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .export-import h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .export-import-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .admin-header h1 {
                font-size: 1.5em;
            }

            .admin-buttons {
                width: 100%;
                flex-direction: column;
            }

            .admin-buttons .btn {
                width: 100%;
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.85em;
            }

            th, td {
                padding: 10px;
            }

            .item-actions {
                flex-direction: column;
            }

            .btn-small {
                width: 100%;
            }
        }

        .success-message {
            background: #27AE60;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-label input {
            width: auto;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1><i class="fas fa-crown"></i> Admin KING</h1>
                <p>Quản Lý Menu & Sản Phẩm</p>
            </div>
            <div class="admin-buttons">
                <button id="add-item-btn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Thêm Món
                </button>
                <button onclick="location.href='index.html'" class="btn btn-secondary">
                    <i class="fas fa-eye"></i> Xem Menu
                </button>
            </div>
        </div>

        <div class="success-message" id="success-msg"></div>

        <div class="stats">
            <div class="stat-card">
                <h3>Tổng Số Món</h3>
                <div class="number" id="total-items">0</div>
            </div>
            <div class="stat-card">
                <h3>Danh Mục</h3>
                <div class="number" id="total-categories">0</div>
            </div>
            <div class="stat-card">
                <h3>Bản Lưu</h3>
                <div class="number" id="backup-count">0</div>
            </div>
        </div>

        <div class="export-import">
            <h3><i class="fas fa-download"></i> Sao Lưu & Khôi Phục</h3>
            <div class="export-import-buttons">
                <button id="export-btn" class="btn btn-success">
                    <i class="fas fa-download"></i> Tải Menu (JSON)
                </button>
                <button id="import-btn" class="btn btn-secondary">
                    <i class="fas fa-upload"></i> Nhập Menu
                </button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
                <button id="backup-btn" class="btn btn-secondary">
                    <i class="fas fa-save"></i> Auto Backup
                </button>
            </div>
        </div>

        <!-- Quick Edit Modal -->
        <div id="quick-edit-modal" class="modal">
            <div class="modal-content" style="max-width: 400px;">
                <div class="modal-header">
                    <h2 id="quick-edit-title">Chỉnh Sửa Nhanh</h2>
                    <button type="button" class="modal-close" onclick="closeQuickEdit()">&times;</button>
                </div>

                <form id="quick-edit-form" onsubmit="saveQuickEdit(event)">
                    <div class="form-group">
                        <label>Tên Món</label>
                        <input type="text" id="quick-edit-name" required>
                    </div>

                    <div class="form-group">
                        <label>Giá Cơ Bản (k)</label>
                        <input type="number" id="quick-edit-price" required min="0">
                    </div>

                    <div class="form-group">
                        <label>Danh Mục</label>
                        <input type="text" id="quick-edit-category" required>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeQuickEdit()">Hủy</button>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="menu-table">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th style="width: 120px;">Ảnh</th>
                        <th>Tên Món</th>
                        <th style="width: 100px;">Danh Mục</th>
                        <th style="width: 80px;">Giá</th>
                        <th style="width: 150px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="menu-tbody">
                    <!-- Items sẽ được load từ JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Món -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Thêm Món Mới</h2>
                <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <form id="item-form">
                <div class="form-group">
                    <label>ID</label>
                    <input type="number" id="item-id" readonly style="background: #F5F5F5;">
                </div>

                <div class="form-group">
                    <label>Tên Món *</label>
                    <input type="text" id="item-name" placeholder="Ví dụ: Lẩu Dê" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Danh Mục *</label>
                        <input type="text" id="item-category" placeholder="Ví dụ: Dê Món Nước" required>
                    </div>
                    <div class="form-group">
                        <label>Giá Cơ Bản (k) *</label>
                        <input type="number" id="item-price" placeholder="200" required min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mô Tả</label>
                    <textarea id="item-description" placeholder="Mô tả chi tiết về món ăn..."></textarea>
                </div>

                <div class="form-group">
                    <label>Ảnh Sản Phẩm</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                        <button type="button" class="btn btn-secondary" style="flex: 1; padding: 10px;" onclick="document.getElementById('image-upload-input').click()">
                            <i class="fas fa-cloud-upload-alt"></i> Tải Ảnh Lên
                        </button>
                        <button type="button" class="btn btn-secondary" style="flex: 1; padding: 10px;" onclick="toggleImageInput()">
                            <i class="fas fa-link"></i> Paste Link
                        </button>
                    </div>
                    <input type="file" id="image-upload-input" accept="image/*" style="display: none;">
                    <input type="text" id="item-image" placeholder="/assets/mon-1.jpg" style="display: none;">
                    <div class="image-preview" id="image-preview">
                        <span style="color: #999;">Không có ảnh</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="item-bestseller">
                        Đánh Dấu Bestseller ⭐
                    </label>
                </div>

                <div class="form-group">
                    <label>Tùy Chọn (JSON)</label>
                    <textarea id="item-options" placeholder='[{"type":"Kích thước","choices":[{"name":"Nhỏ","price":150}]}]'></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
